set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*256col*:Tc"

set -g mouse on

# Quick keys (no prefix needed)
bind -n C-t new-window \; run-shell "~/.tmux/plugins/tmux-resurrect/scripts/save.sh"
bind -n "C-Tab" next-window
bind -n "C-S-Tab" previous-window
bind -n M-Left previous-window
bind -n M-Right next-window
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Kill window without confirm prompt (used by Cmd+W via Ghostty)
unbind &
bind & kill-window

# Forward bells to terminal (for Ghostty notifications)
set -g bell-action any

# macOS notification on bell from any window
set-hook -g alert-bell 'run-shell "osascript -e ''display notification \"Window #{window_index}: #{window_name}\" with title \"Tmux Bell\"''"'

# Show last folder name in tab instead of "zsh"
set -g automatic-rename-format '#{b:pane_current_path}'

# Status bar styling — active tab highlight
set -g status-position top
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g status-left ""
set -g status-right "#[fg=#a6adc8]%Y-%m-%d %H:%M"
set -g window-status-style "bg=#313244,fg=#585b70"
set -g window-status-format " #I:#W "
set -g window-status-current-style "bg=#89b4fa,fg=#1e1e2e,bold"
set -g window-status-current-format " #I:#W "
set -g window-status-separator ""

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @continuum-restore 'on'
set -g @continuum-save-interval '5'

# Ctrl+b c → new tab
# Ctrl+b Ctrl+s → save now
# Ctrl+b Ctrl+r → restore
# Ctrl+b ? → list all keys

run '~/.tmux/plugins/tpm/tpm'
